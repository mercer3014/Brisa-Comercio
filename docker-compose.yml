# Geodata en Dokploy: web (Apache + Laravel), worker de la cola y PostgreSQL.
# Las variables sin valor por defecto (${...:?}) se configuran en Dokploy > Environment.

x-app-env: &app-env
  APP_NAME: Geodata
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Falta APP_KEY}
  APP_URL: ${APP_URL:?Falta APP_URL}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:?Falta POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER:?Falta POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
  DB_SEARCH_PATH: public
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database

services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "php artisan config:cache && exec apache2-foreground"
    environment: *app-env
    volumes:
      - geodata-storage:/var/www/html/storage/app
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  worker:
    build: .
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work --tries=1 --timeout=3700 --sleep=3 --max-time=3600
    environment: *app-env
    volumes:
      - geodata-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - geodata-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  geodata-pgdata:
  geodata-storage:
