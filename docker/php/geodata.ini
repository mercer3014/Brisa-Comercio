; Ajustes de PHP para Geodata (se cargan en la imagen de la app y del worker).

; Las cargas de Excel/CSV llegan a 500 MB (CargaController::previsualizar).
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
